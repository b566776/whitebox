<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      :root {
        --primary-color: #4338ca;
        --bg-color: #f8fafc;
        --text-main: #0f172a;
        --border-color: #e2e8f0;
      }
      body {
        font-family: 'Inter', sans-serif;
        padding: 20px;
        background-color: var(--bg-color);
        color: var(--text-main);
      }
      .container {
        max-width: 100%;
      }
      h1 {
        font-size: 18px;
        margin-bottom: 20px;
        color: var(--primary-color);
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 10px;
      }
      .quiz-item {
        background: white;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 5px;
        color: #64748b;
      }
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 14px;
        resize: vertical;
        margin-bottom: 10px;
      }
      .option-group {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .option-input {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      input[type="text"] {
        flex: 1;
        padding: 8px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 13px;
      }
      .footer {
        margin-top: 20px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      .btn {
        padding: 10px 20px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        border: none;
      }
      .btn-primary { background: var(--primary-color); color: white; }
      .btn-secondary { background: #e2e8f0; color: #475569; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📋 Revisão do Quiz de Autonomia</h1>
      <div id="quiz-list">
        <!-- Questions will be rendered here -->
      </div>
      
      <div class="footer">
        <button class="btn btn-secondary" onclick="google.script.host.close()">Cancelar</button>
        <button class="btn btn-primary" onclick="submitQuiz()">ENVIAR PARA O ALUNO</button>
      </div>
    </div>

    <script>
      // O dado do quiz é injetado via templating
      let quizData = <?!= JSON.stringify(quizData) ?>;

      function renderQuiz() {
        const container = document.getElementById('quiz-list');
        container.innerHTML = '';
        
        quizData.forEach((item, qIndex) => {
          const div = document.createElement('div');
          div.className = 'quiz-item';
          div.innerHTML = `
            <label>PERGUNTA ${qIndex + 1}:</label>
            <textarea id="q-${qIndex}">${item.question}</textarea>
            
            <label>OPÇÕES:</label>
            <div class="option-group">
              ${item.options.map((opt, oIndex) => `
                <div class="option-input">
                  <input type="radio" name="correct-${qIndex}" ${item.answer === oIndex ? 'checked' : ''} value="${oIndex}">
                  <input type="text" id="q-${qIndex}-o-${oIndex}" value="${opt}">
                </div>
              `).join('')}
            </div>
          `;
          container.appendChild(div);
        });
      }

      function submitQuiz() {
        // Captura as alterações
        const updatedQuiz = quizData.map((item, qIndex) => {
          const question = document.getElementById(`q-${qIndex}`).value;
          const options = item.options.map((_, oIndex) => {
             return document.getElementById(`q-${qIndex}-o-${oIndex}`).value;
          });
          const answer = parseInt(document.querySelector(`input[name="correct-${qIndex}"]:checked`).value);
          
          return { question, options, answer };
        });

        google.script.run
          .withSuccessHandler(() => {
            google.script.host.close();
          })
          .submitFinalQuiz(updatedQuiz);
      }

      window.onload = renderQuiz;
    </script>
  </body>
</html>
