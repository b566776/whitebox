<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --bg-dark: #0f172a;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1, h2 { font-family: 'Outfit', sans-serif; }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      width: 100%;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--glass-border);
      color: white;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-family: inherit;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    button:hover { background: var(--primary-dark); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th {
      text-align: left;
      padding: 1rem;
      border-bottom: 1px solid var(--glass-border);
      color: var(--text-dim);
      font-weight: 500;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid var(--glass-border);
      font-size: 0.9375rem;
    }

    .badge {
      padding: 0.25rem 0.50rem;
      border-radius: 1rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-active { background: rgba(16, 185, 129, 0.1); color: var(--success); }
    
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--glass-border);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      border-radius: 0.5rem;
      background: var(--success);
      color: white;
      display: none;
      animation: slideUp 0.3s ease-out;
      z-index: 1001;
    }

    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

<div class="loading-overlay" id="loader">
  <div class="spinner"></div>
</div>

<div class="toast" id="toast">Operação realizada com sucesso!</div>

<div class="container">
  <header>
    <div class="logo">WHITEBOX ADMIN</div>
    <div id="sharedTokenDisplay" style="font-size: 0.8rem; color: var(--text-dim);"></div>
  </header>

  <div class="card">
    <h2>Configuração do Master Seed</h2>
    <p style="color: var(--text-dim); margin-bottom: 1rem; font-size: 0.9rem;">
      Cole o ID do Google Doc que servirá de modelo para todos os professores. 
      Certifique-se de que o código cliente já está com o push feito nele.
    </p>
    <div class="config-grid">
      <div>
        <label>ID do Documento Semente</label>
        <input type="text" id="seedIdInput" placeholder="Ex: 1A2b3c4d5e6f7g8h9i0j...">
      </div>
      <div style="display: flex; align-items: flex-end;">
        <button onclick="saveSeed()">Salvar Configuração</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Professores & Licenças B2B</h2>
    <div id="profList">
      <table>
        <thead>
          <tr>
            <th>Email</th>
            <th>Escola</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="profTableBody">
          <!-- Rows will be injected here -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  function showLoader(show) {
    document.getElementById('loader').style.display = show ? 'flex' : 'none';
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.background = isError ? '#ef4444' : '#10b981';
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 4000);
  }

  function refreshData() {
    showLoader(true);
    google.script.run
      .withSuccessHandler(data => {
        showLoader(false);
        renderData(data);
      })
      .withFailureHandler(err => {
        showLoader(false);
        showToast('Erro ao carregar dados: ' + err, true);
      })
      .getAdminUIData();
  }

  function renderData(data) {
    document.getElementById('seedIdInput').value = data.seedId || '';
    document.getElementById('sharedTokenDisplay').innerText = 'Token: ' + data.sharedToken;

    const tbody = document.getElementById('profTableBody');
    tbody.innerHTML = '';

    data.professores.forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${p.email}</td>
        <td>${p.escola}</td>
        <td><span class="badge badge-active">${p.status}</span></td>
        <td>
          <button onclick="distribute('${p.email}')">Distribuir Template</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function saveSeed() {
    const id = document.getElementById('seedIdInput').value;
    showLoader(true);
    google.script.run
      .withSuccessHandler(() => {
        showLoader(false);
        showToast('ID do Semente salvo com sucesso!');
      })
      .withFailureHandler(err => {
        showLoader(false);
        showToast('Erro ao salvar: ' + err, true);
      })
      .salvarSeedId(id);
  }

  function distribute(email) {
    if(!confirm('Deseja criar um Documento Mestre e enviar para ' + email + '?')) return;
    showLoader(true);
    google.script.run
      .withSuccessHandler(result => {
        showLoader(false);
        showToast('Template enviado para ' + email + '!');
      })
      .withFailureHandler(err => {
        showLoader(false);
        showToast('Falha na distribuição: ' + err, true);
      })
      .distribuirMestreParaProfessor(email);
  }

  // Initial load
  window.onload = refreshData;
</script>

</body>
</html>
